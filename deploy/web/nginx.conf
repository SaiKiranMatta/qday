# The site is a single-page app: any path that isn't a file (/app for the wallet, /tx/<hash> for the explorer) gets
# index.html. Hashed assets are cached for good; index.html never is, so a deploy shows at once.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    # application/octet-stream covers the landing page's STL models, which nginx has no type for.
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/octet-stream;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
