[workspace]
resolver = "3"
members = ["crates/qday-xmss", "crates/qday-wallet", "crates/qday-cli"]
exclude = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# A tree is about a million hashes, which is too slow unoptimised.
[profile.dev]
opt-level = 2
