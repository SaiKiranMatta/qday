[package]
name = "qday-wallet"
description = "Device logic: counter, key storage, passcode, backup, USB protocol and frame transactions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
bip39 = { version = "2.2", default-features = false }
qday-mldsa = { path = "../qday-mldsa" }
qday-xmss = { path = "../qday-xmss" }
x-wing = { version = "0.1.1", default-features = false, features = ["hazmat", "zeroize"] }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
