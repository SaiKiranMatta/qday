version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
qday-mldsa = { path = "../qday-mldsa" }
qday-wallet = { path = "../qday-wallet" }
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
