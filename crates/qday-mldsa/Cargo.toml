[package]
name = "qday-mldsa"
description = "ML-DSA-44 signing behind a small API, so a custom signer can replace it later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
fips204 = { version = "0.5.0", default-features = false, features = ["ml-dsa-44"] }
qday-xmss = { path = "../qday-xmss" }
sha3 = { version = "0.10.8", default-features = false }
zeroize = { version = "1.8", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
