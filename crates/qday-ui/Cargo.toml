[package]
name = "qday-ui"
description = "Screens, soft keys and themes for the QDay device"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Bitmap fonts for the retro terminal themes.
embedded-graphics = "0.8"
libm = "0.2"
qday-wallet = { path = "../qday-wallet" }
qday-xmss = { path = "../qday-xmss" }

[dev-dependencies]
png = "0.18"

# The drawing code is float geometry throughout, so the workspace's pedantic casts don't fit it.
[lints.clippy]
all = "warn"
